; OpenNEK RSSI streamer for the SEONG JI LSM100A (STM32WLE5CC)
;   pio run                 -> .pio/build/lsm100a/firmware.bin
; Flash it through the module's IAP bootloader (Ymodem over UART), see README.md.
; The board definition of the Ebyte E77 is reused because it has the same MCU.

[env:lsm100a]
platform = ststm32
board = ebyte_e77_dev
framework = arduino
; The IAP bootloader occupies the first 8 KB; applications start at 0x08002000
board_build.flash_offset = 0x2000
build_flags =
  -DSERIAL_TX_BUFFER_SIZE=512
  -DSERIAL_RX_BUFFER_SIZE=128
  -Wall
