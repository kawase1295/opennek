[package]
name = "opennek"
description = "Local network for real Sigfox devices: decode their uplinks from a USB receiver, run Sigfox-compatible callbacks and send downlinks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
sigfox = { version = "0.1.0", path = "../sigfox" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
