; OpenNEK firmware for the ESP32-S3 side of the Sigfox receiver
;   pio run -e bridge-s3 -t upload           USB <-> UART bridge to the RSSI streamer
;   pio run -e tester-cardputer -t upload    standalone tester (M5Stack Cardputer)
;   pio run -e radio-xiao-sx1262 -t upload   the radio: XIAO ESP32S3 & Wio-SX1262 kit as RSSI streamer

[platformio]
default_envs = bridge-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

; USB <-> UART bridge for an ESP32-S3 board with an LSM100A on its UART (Cardputer Grove: G1=RX, G2=TX).
; Uses the hardware USB serial (USB_MODE=1), which works reliably through usbipd on WSL.
[env:bridge-s3]
board = ${s3.board}
build_flags = ${s3.build_flags}
build_src_filter = +<bridge/>

; Standalone Sigfox tester for the M5Stack Cardputer with the LSM100A RSSI streamer on Grove (receive only).
;   pio run -e tester-cardputer -t upload
[env:tester-cardputer]
board = ${s3.board}
board_build.partitions = default_8MB.csv
build_flags = ${s3.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<tester/>
lib_deps = m5stack/M5Cardputer@^1.1.1

; The radio for real Sigfox devices: XIAO ESP32S3 & Wio-SX1262 kit, the RSSI streamer of firmware-lsm100a on the
; SX1262 (lib/RadioStreamer, tested on the PC by test/streamer_native_test.cpp).
;   pio run -e radio-xiao-sx1262 -t upload
[env:radio-xiao-sx1262]
board = seeed_xiao_esp32s3
build_flags = ${s3.build_flags}
build_src_filter = +<radio-xiao-sx1262/>
