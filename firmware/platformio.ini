; OpenNEK ファームウェア
;   pio run -e gateway -t upload    ゲートウェイ (USB でホストに挿す ESP32)
;   pio run -e device  -t upload    デバイス (AT モデムエミュレータ)
; ESP32-S3 (ネイティブ USB) のボードは *-s3 を使う

[platformio]
default_envs = gateway, device

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -DOPENNEK_FW_VERSION=\"0.1.0\" -Wall

[s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:gateway]
board = esp32dev
build_src_filter = +<gateway/>

[env:device]
board = esp32dev
build_src_filter = +<device/>

[env:gateway-s3]
board = ${s3.board}
build_flags = ${s3.build_flags}
build_src_filter = +<gateway/>

[env:device-s3]
board = ${s3.board}
build_flags = ${s3.build_flags}
build_src_filter = +<device/>
