[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app links webkit2gtk / WebView2, so plain cargo commands leave it out and the `opennek` executable
# stays a static musl binary; build it with `-p opennek-desktop`
default-members = ["crates/sigfox", "crates/opennek-core", "crates/opennek-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kawase1295/opennek"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
