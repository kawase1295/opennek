name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macOS is best effort and has no job (#25)
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # uvx fetches zig, which builds the firmware's native tests
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host
      # The pty tests need socat; they are skipped where it is missing (Windows)
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y socat
      - run: scripts/check
        shell: bash
